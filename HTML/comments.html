<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Tag</title>
</head>
<body>
    <h1>Comments in HTML</h1>
    <p>Comments in HTML are used to mark text which should not be parsed. They can help document the source code.</p>
    <h2>For Example</h2>
    <h3>My Website</h3>
    <!-- This paragraph contains a welcome message -->
    To write text like  <!-- This paragraph contains a welcome message --> we press Ctrl + /.
    <p>Welcome to my website!</p>
</body>
</html>
