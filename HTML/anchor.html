<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anchor Tag</title>
</head>
<body>
    <h1>The Anchor Tag</h1>
    <p>The Anchor Tag is used to add links to an existing content inside an HTML page.</p>
    <a href="https://google.com">click here</a>
    <h2>For Example</h2>
    <a href="https://youtube.com">Youtube</a>
    <p>The a tag is used to create a hyperlink. The href attribute specifies the URL of the link.</p>
</body>
</html>
