<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <h1>Hr Tag</h1>
    <p><hr> tag in HTML is used to create a horizontal ruler often used to separate the content.</p>
    <hr>
    <h2>For Example</h2>
    <p>This is the first paragraph.</p>
    <hr>
    <p>This is the second paragraph.</p>
    The hr tag is used to create a horizontal line to separate content in HTML.
</body>
</html>
