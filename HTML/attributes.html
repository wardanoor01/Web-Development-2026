<!DOCTYPE html>
<html lang="en">
<head>

    <title>Html Attributes</title>
</head>
<body>
    <h1>Html Attributes</h1>
    <p>HTML attributes are used to add more information corresponding to an HTML tag.</p>
    <h2>For Example</h2>
    <p>The anchor tag is used to create links.</p>
    <a href="https://google.com">click here</a>
    <p>We can either use single or double quotes in attributes.</p>
