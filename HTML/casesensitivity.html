<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Sensitivity</title>
</head>
<body>
    <h1>Case Sensitivity</h1>
    <p>HTML is a case insensitive language. <H1> and <h1> tags are the same.</p>
    <h2>For Example</h2>
    <H1>Hello World</H1>
    <h1>Hello World</h1>
</body>
</html>
