<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Tag</title>
</head>
<body>
    <h1>Span Tag</h1>
    <p>The <span> tag is an inline container, meaning it only takes up as much width as necessary.</p>
    <p>This is a <span>highlighted</span> word in a sentence.</p>
    <h2>For Example</h2>
    <p>My name is <span>Warda Noor</span>.</p>
    The span tag is used to group a specific part of text within a line.
</body>
</html>
