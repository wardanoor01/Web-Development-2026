<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscript Tag</title>
</head>
<body>
    <h1>Subscript Tag</h1>
    <p>We can add subscript in HTML as follows:</p>
    this<sub>is</sub>subscript.
    <h2>For Example</h2>
    <p>H<sub>2</sub>O</p>
    The sub tag is used to display text slightly below the normal line.
    <h3>Output</h3>
    H₂O
</body>
</html>
