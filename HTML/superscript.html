<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superscript Tag</title>
</head>
<body>
    <h1>Superscript Tag</h1>
    <p>We can add superscript in HTML as follows:</p>
    this<sup>is</sup>superscript.
    <h2>For Example</h2>
    <p>2<sup>3</sup> = 8</p>
    The sup tag is used to display text slightly above the normal line.
    <h3>Output</h3>
    2³ = 8
</body>
</html>
