<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italic Tag</title>
</head>
<body>
    <h1>Italic Tag</h1>
    <p>We can use italic tag to highlight the text as follows:</p>
    <i>This is italic.</i>
    <h2>For Example</h2>
    <i>This text is italic.</i>
