<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tag</title>
</head>
<body>
    <h1>Big Tag</h1>
    <p>We can make text a bit larger using <big> tag respectively.</p>
    <big>Hello World</big>
    <h2>For Example</h2>
    <p>This is normal text. <big>This is bigger text.</big></p>
    The big tag was used to make text appear larger than the surrounding text. It is obsolete in HTML5.
</body>
</html>
