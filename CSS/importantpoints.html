<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Points</title>
</head>
<body>
    <h1>Important Points</h1>
    <p>The hash (#) targets an ID, while the dot (.) targets a class.</p>
    <p>We can group selectors like this:</p>
    h1,h2,h3,div{
        color: blue; <!-- h1,h2,h3 and div will be blue -->
    }
</body>
</html>
