<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
</head>
<body>
    <h1>CSS Selectors</h1>
    <p>A CSS Selector is used to select an HTML elements for styling</p>
    <!-- body selector -->
    body{
        color: red; <!-- Declaration (property: value) -->
        background: pink; <!-- Declaration -->
    }
    <h2>For Example</h2>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Natus quos sit ratione? Earum veritatis ratione repellat pariatur. Consequuntur, repellat sequi.</p>
    </div>
</body>
</html>
