<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add CSS to HTML</title>
</head>
<body>
    <h1>Three ways to add CSS to HTML</h1>
    <p>There are three ways to add CSS to HTML.</p>
    <ol>
        <li><b>style tag</b>: Adding <style></style> to HTML.</li>
        <li><b>Inline CSS</b>: Adding CSS using style attribute.</li>
        <li><b>External CSS</b>: Adding a stylesheet (.css) to HTML using <link> tag.</li>
    </ol>
</body>
</html>
